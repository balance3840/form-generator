name: CI

on:
  push:
    branches: [main]
  pull_request:

# a newer run on the same branch or pull request replaces the one still running
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'   # the browser is only for the e2e tests
      - run: npm run build
      - run: npm run check:flow
